name: Build Android APK and AAB
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Validate game JavaScript
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('www/index.html','utf8');const match=html.match(/<script>([\\s\\S]*?)<\\/script>/);if(!match)throw new Error('Game script not found');new Function(match[1]);console.log('Game JavaScript syntax OK')"
      - name: Generate a clean Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build APK and AAB
        working-directory: android
        run: |
          ./gradlew assembleDebug bundleRelease
      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neon-danger-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
