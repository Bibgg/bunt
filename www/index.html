<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070817"><title>NEON DANGER</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070817;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:env(safe-area-inset-top) 0 auto auto;display:flex;justify-content:space-between;padding:16px 18px;pointer-events:none;color:#eafcff;text-shadow:0 0 12px #00eaff;font-weight:900;letter-spacing:1px}#hud small{display:block;color:#9fb8ce;font-size:10px;letter-spacing:2px}#hud b{font-size:22px}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#10162dcc,#050610eF);padding:24px;text-align:center}#panel{max-width:420px;width:100%;border:1px solid #00eaff66;border-radius:24px;padding:30px 22px;background:#0a1024e8;box-shadow:0 0 40px #00eaff22,inset 0 0 35px #ff00d411}h1{font-size:clamp(36px,10vw,64px);line-height:.9;margin:0 0 12px;color:#f4fcff;text-shadow:0 0 9px #00eaff,0 0 28px #00eaff88;letter-spacing:2px}#subtitle{color:#a7bfd5;margin:16px 0 24px;line-height:1.5}button{border:0;border-radius:14px;padding:16px 26px;font-size:16px;font-weight:1000;letter-spacing:2px;color:#041018;background:linear-gradient(100deg,#00f5ff,#9aff00);box-shadow:0 0 24px #00eaff55;min-width:190px}button:active{transform:scale(.97)}#hint{font-size:11px;color:#728da9;margin-top:18px;letter-spacing:1px}.hide{display:none!important}
</style></head><body><canvas id="game"></canvas><div id="hud"><div><small>SCORE</small><b id="score">000000</b></div><div style="text-align:right"><small>BEST · COMBO</small><b><span id="best">0</span> · <span id="combo">1x</span></b></div></div><div id="overlay"><div id="panel"><h1>NEON<br>DANGER</h1><div id="subtitle">DODGE THE DEADLY GRID<br>RUN FAST. STAY ALIVE.</div><button id="play">START RUN</button><div id="hint">TAP LEFT / RIGHT OR SWIPE TO DODGE</div></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),play=document.getElementById('play'),subtitle=document.getElementById('subtitle'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo');let W=0,H=0,dpr=1,mode='ready',last=0,time=0,score=0,best=+(localStorage.neonDangerBest||0),speed=280,spawn=0,combo=1,comboTime=0,shake=0,closeText=0,player,obstacles=[],particles=[],stars=[];bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(player)player.y=H*.78;stars=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,z:.3+Math.random()*1.7}))}addEventListener('resize',resize);resize();
const lanes=()=>[W*.22,W*.5,W*.78];function reset(){score=0;time=0;speed=280;spawn=.65;combo=1;comboTime=0;shake=0;closeText=0;obstacles=[];particles=[];player={lane:1,x:lanes()[1],y:H*.78,r:15,trail:[]};scoreEl.textContent='000000';comboEl.textContent='1x';mode='playing';overlay.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function move(dir){if(mode!=='playing')return;player.lane=Math.max(0,Math.min(2,player.lane+dir));}
let startX=0,startY=0;c.addEventListener('pointerdown',e=>{if(mode!=='playing'){reset();return}startX=e.clientX;startY=e.clientY;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerup',e=>{if(mode!=='playing')return;let dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>25)move(dx>0?1:-1);else if(Math.abs(dy)<30)move(e.clientX<W/2?-1:1)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if((e.key===' '||e.key==='Enter')&&mode!=='playing')reset()});
play.addEventListener('click',reset);
function burst(x,y,color,n=14){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=50+Math.random()*280;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+Math.random()*.6,max:.9,size:2+Math.random()*4,color})}}
function obstacle(){let lane=Math.floor(Math.random()*3),kind=Math.random()<.26?'laser':Math.random()<.45?'spike':'block';if(Math.random()<.18){kind='bar';lane=1}obstacles.push({lane,y:-60,w:kind==='laser'?12:kind==='bar'?W*.62:46,h:kind==='spike'?30:kind==='laser'?100:kind==='bar'?18:42,kind,passed:false,color:kind==='laser'?'#ff254f':kind==='spike'?'#ff6a00':kind==='bar'?'#ff00d9':'#ffb000'})}
function drawGlow(color,blur=18){ctx.shadowColor=color;ctx.shadowBlur=blur}
function loop(now){if(mode!=='playing')return;let dt=Math.min((now-last)/1000,.035);last=now;time+=dt;speed=280+Math.min(time*11,650);score+=dt*speed*.06*combo;spawn-=dt;if(spawn<=0){obstacle();spawn=Math.max(.32,1.05-speed/1500)+Math.random()*.25}
let target=lanes()[player.lane];player.x+=(target-player.x)*Math.min(1,dt*15);player.trail.push({x:player.x,y:player.y,life:.22});player.trail.forEach(p=>p.life-=dt);player.trail=player.trail.filter(p=>p.life>0);
comboTime-=dt;if(comboTime<=0&&combo>1){combo=1;comboEl.textContent='1x'}closeText-=dt;shake=Math.max(0,shake-dt*25);
for(let o of obstacles){o.y+=speed*dt;if(!o.passed&&o.y>player.y+10){o.passed=true;score+=100*combo;comboTime=2.2;combo=Math.min(5,combo+1);if(combo>=5)combo=5;comboEl.textContent=combo+'x';burst(lanes()[o.lane],o.y,o.color,8)}
let ox=lanes()[o.lane],hitY=Math.abs(o.y-player.y)<(o.h/2+player.r*.65),hitX=Math.abs(ox-player.x)<(o.kind==='bar'?o.w/2+player.r:o.w/2+player.r*.65);if(hitY&&hitX){if(Math.abs(o.y-player.y)<o.h/2+player.r+25){closeText=.65;score+=35*combo}burst(player.x,player.y,'#ff245a',35);shake=14;endGame();return}}
obstacles=obstacles.filter(o=>o.y<H+120);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);p.life-=dt}particles=particles.filter(p=>p.life>0);
scoreEl.textContent=String(Math.floor(score)).padStart(6,'0');render(dt);requestAnimationFrame(loop)}
function endGame(){mode='over';best=Math.max(best,Math.floor(score));localStorage.neonDangerBest=best;bestEl.textContent=best;subtitle.innerHTML='RUN ENDED · SCORE '+Math.floor(score)+'<br>BEST '+best+'<br><span style="color:#ff496f">THE GRID GOT YOU.</span>';play.textContent='PLAY AGAIN';document.getElementById('hint').textContent='TAP TO RESTART · READY INSTANTLY';overlay.classList.remove('hide');render(0)}
function render(dt){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#070817';ctx.fillRect(-20,-20,W+40,H+40);
let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#080b20');grad.addColorStop(1,'#101027');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
for(let s of stars){s.y+=s.z*(mode==='playing'?speed*.0006:18)*Math.max(dt,.01);if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle='rgba(105,220,255,'+(.15+s.z*.25)+')';ctx.fillRect(s.x,s.y,s.z*1.5,s.z*1.5)}
let xs=lanes();ctx.lineWidth=1;for(let x of xs){ctx.strokeStyle='#00eaff20';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.strokeStyle='#00eaff18';for(let y=(time*speed*.4)%48;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
obstacles.forEach(o=>{let x=xs[o.lane];ctx.save();drawGlow(o.color,22);ctx.fillStyle=o.color;ctx.strokeStyle=o.color;if(o.kind==='spike'){ctx.beginPath();ctx.moveTo(x-o.w/2,o.y+o.h/2);ctx.lineTo(x,o.y-o.h/2);ctx.lineTo(x+o.w/2,o.y+o.h/2);ctx.closePath();ctx.fill()}else if(o.kind==='laser'){ctx.globalAlpha=.65;ctx.fillRect(x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.globalAlpha=1;ctx.fillRect(x-2,o.y-o.h/2,4,o.h)}else if(o.kind==='bar'){ctx.fillRect(W/2-o.w/2,o.y-o.h/2,o.w,o.h)}else{ctx.fillRect(x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.strokeRect(x-o.w/2-5,o.y-o.h/2-5,o.w+10,o.h+10)}ctx.restore()});
if(player){player.trail.forEach(p=>{ctx.globalAlpha=p.life/.22*.45;drawGlow('#00eaff',15);ctx.fillStyle='#00eaff';ctx.beginPath();ctx.arc(p.x,p.y,player.r*p.life/.22,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.save();drawGlow('#00f5ff',24);let pg=ctx.createLinearGradient(player.x-player.r,player.y-player.r,player.x+player.r,player.y+player.r);pg.addColorStop(0,'#00f5ff');pg.addColorStop(.5,'#fff');pg.addColorStop(1,'#9aff00');ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(player.x-player.r,player.y-player.r,player.r*2,player.r*2,7);ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);drawGlow(p.color,12);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;
if(closeText>0){ctx.save();ctx.globalAlpha=Math.min(1,closeText*2);drawGlow('#ffd600',25);ctx.textAlign='center';ctx.font='900 28px system-ui';ctx.fillStyle='#fff36b';ctx.fillText('CLOSE CALL!',W/2,H*.42);ctx.restore()}
ctx.restore()}
render(0);})();
</script></body></html>
